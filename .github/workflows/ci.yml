name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm i18n:check

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wxt build -b ${{ matrix.target }}
      - name: Check bundle budgets
        run: node scripts/check-budgets.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: unpacked-${{ matrix.target }}
          path: .output/${{ matrix.target }}-mv3
          retention-days: 7

  validate-firefox:
    name: web-ext lint (Firefox)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wxt build -b firefox
      # AMO runs this exact linter on submission — catching it here is free.
      - run: npx --yes web-ext lint --source-dir .output/firefox-mv3 --warnings-as-errors
