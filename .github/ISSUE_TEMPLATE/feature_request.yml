name: Feature request
description: Suggest a use case
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: The use case
      description: What are you trying to do in the browser, and what is annoying about it today?
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Related items in docs/roadmap.md, prior art in other extensions, constraints.
